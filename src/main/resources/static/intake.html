<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropPoint — Load today's orders</title>
<style>
  :root { --ink:#1c2733; --soft:#5a6875; --rule:#dde3e9; --paper:#f6f8fa;
          --blue:#1f6e8c; --green:#1e6b47; --red:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--paper);
         color:var(--ink); line-height:1.55; }
  .wrap { max-width:900px; margin:0 auto; padding:30px 20px 70px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--soft); margin:0 0 24px; }
  .box { background:#fff; border:1px solid var(--rule); border-radius:11px;
         padding:18px 20px; margin-bottom:16px; }
  h2 { font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em;
       color:var(--soft); margin:0 0 10px; }
  textarea { width:100%; height:170px; padding:11px; border:1px solid var(--rule);
             border-radius:8px; font-family:"JetBrains Mono",Consolas,monospace;
             font-size:0.85rem; resize:vertical; }
  button { padding:10px 17px; margin:10px 8px 0 0; border:0; border-radius:8px;
           background:var(--blue); color:#fff; font-size:0.95rem; cursor:pointer; }
  button.grey { background:#fff; border:1px solid var(--rule); color:var(--ink); }
  button.go { background:var(--green); }
  button:disabled { opacity:0.4; cursor:default; }
  input[type=file] { font-size:0.9rem; }
  table { width:100%; border-collapse:collapse; font-size:0.88rem; margin-top:10px; }
  th,td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--rule); }
  th { font-size:0.75rem; color:var(--soft); text-transform:uppercase; }
  tr.bad td { background:#fdf0ef; color:var(--red); }
  .pills { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .pill { background:var(--paper); border:1px solid var(--rule); border-radius:99px;
          padding:4px 11px; font-size:0.85rem; }
  .sum { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:6px; }
  .sum b { font-size:1.4rem; display:block; }
  .sum span { color:var(--soft); font-size:0.83rem; }
  .note { color:var(--soft); font-size:0.85rem; margin-top:8px; }
  a { color:var(--blue); }
</style>
</head>
<body>
<div class="wrap">

  <h1>Load today's orders</h1>
  <p class="sub">Paste the list or upload a CSV. No coordinates needed — just the area.</p>

  <div class="box">
    <h2>Paste or upload</h2>
    <textarea id="text" placeholder="phone, name, area, address, cylinders, type
9100000042, Lakshmi Devi, Kothapet, Near bus stop 2nd lane, 1, DOMESTIC
9100000043, Hotel Blue Moon, Dilsukhnagar, Main road, 4, COMMERCIAL"></textarea>
    <div>
      <input type="file" id="file" accept=".csv,.txt" onchange="loadFile()">
    </div>
    <button onclick="preview()">Check the list</button>
    <button class="grey" onclick="sample()">Use a sample list</button>
    <div class="note">Areas we deliver to: <span id="areaNames">loading…</span></div>
  </div>

  <div class="box" id="result" hidden>
    <h2>Preview</h2>
    <div class="sum" id="summary"></div>
    <div class="pills" id="areaPills"></div>
    <div id="tableWrap"></div>
    <button class="go" id="importBtn" onclick="doImport()">Import these orders</button>
  </div>

  <div class="box" id="done" hidden>
    <h2>Imported</h2>
    <div id="doneText"></div>
    <p class="note"><a href="/">Back to the dashboard</a></p>
  </div>

</div>

<script>
let areaNames = [];

// A pasted name or address is shown back to the manager, so escape it first.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

fetch('/api/areas').then(r => r.json()).then(list => {
  areaNames = list.map(a => a.name);
  document.getElementById('areaNames').textContent = areaNames.join(' · ');
});

function loadFile() {
  const f = document.getElementById('file').files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('text').value = e.target.result; preview(); };
  reader.readAsText(f);
}

function sample() {
  const names = ['Lakshmi Devi','Venkat Rao','Priya Sharma','Anand Tiffins','Ramesh Naidu',
                 'Sunitha Rao','Hotel Blue Moon','Kiran Kumar','Padma Latha','Sri Sai Mess',
                 'Harish Chandra','Jyothi Prasad','Green Leaf Hotel','Satish Chandra','Sarita Singh'];
  let out = 'phone, name, area, address, cylinders, type\n';
  for (let i = 0; i < 25; i++) {
    const name = names[i % names.length] + (i >= names.length ? ' ' + (i + 1) : '');
    const area = areaNames[Math.floor(Math.random() * areaNames.length)] || 'Kothapet';
    const commercial = /Hotel|Mess|Tiffins/.test(name);
    out += `91${String(20000000 + i * 137).padStart(8,'0')}, ${name}, ${area}, `
         + `Street ${1 + i % 9}, ${commercial ? 2 + i % 3 : 1}, `
         + `${commercial ? 'COMMERCIAL' : 'DOMESTIC'}\n`;
  }
  document.getElementById('text').value = out;
  preview();
}

async function preview() {
  const text = document.getElementById('text').value;
  if (!text.trim()) return;
  const p = await fetch('/api/intake/preview', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text })
  }).then(r => r.json());

  document.getElementById('result').hidden = false;
  document.getElementById('done').hidden = true;

  document.getElementById('summary').innerHTML =
      `<div><b>${p.valid}</b><span>orders ready</span></div>`
    + `<div><b>${p.knownCustomers}</b><span>existing customers</span></div>`
    + `<div><b>${p.newCustomers}</b><span>new customers</span></div>`
    + `<div><b style="color:${p.problems ? 'var(--red)' : 'inherit'}">${p.problems}</b><span>problem lines</span></div>`;

  document.getElementById('areaPills').innerHTML =
    Object.entries(p.byArea).sort((a,b) => b[1]-a[1])
      .map(([a,n]) => `<span class="pill">${esc(a)} — ${n}</span>`).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Name</th><th>Area</th><th>Cyl</th><th>Type</th><th>Location</th></tr></thead>
      <tbody>${p.rows.slice(0, 40).map(r => r.problem
        ? `<tr class="bad"><td>${r.lineNo}</td><td colspan="5">${esc(r.problem)}</td></tr>`
        : `<tr><td>${r.lineNo}</td><td>${esc(r.name)}</td><td>${esc(r.area)}</td><td>${r.cylinders}</td>
             <td>${r.type === 'COMMERCIAL' ? 'commercial' : 'home'}</td>
             <td>${r.locationSource === 'EXACT' ? 'exact (past delivery)' : 'from area'}</td></tr>`
      ).join('')}</tbody>
    </table>
    ${p.rows.length > 40 ? `<p class="note">Showing the first 40 of ${p.rows.length} lines.</p>` : ''}`;

  document.getElementById('importBtn').disabled = p.valid === 0;
}

async function doImport() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true; btn.textContent = 'Importing…';
  const text = document.getElementById('text').value;
  const out = await fetch('/api/intake/import', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text })
  }).then(r => r.json());

  btn.textContent = 'Import these orders';
  document.getElementById('result').hidden = true;
  document.getElementById('done').hidden = false;
  document.getElementById('doneText').innerHTML =
      `<p><b>${out.ordersCreated} orders</b> created`
    + (out.customersCreated ? `, including <b>${out.customersCreated} new customers</b>` : '')
    + (out.skipped ? `. <span style="color:var(--red)">${out.skipped} lines skipped.</span>` : '.')
    + `</p><div class="pills">`
    + Object.entries(out.byArea).sort((a,b) => b[1]-a[1])
        .map(([a,n]) => `<span class="pill">${esc(a)} — ${n}</span>`).join('')
    + `</div>`
    + (out.problems.length ? `<p class="note">${out.problems.slice(0,10).map(esc).join('<br>')}</p>` : '');
}
</script>
</body>
</html>
