<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropPoint — AI Assistant</title>
<style>
  :root { --ink:#1c2733; --soft:#4d5b69; --rule:#d5dce3; --blue:#1f6e8c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f5f7f9; color:var(--ink);
         display:flex; flex-direction:column; height:100vh; }
  header { background:#fff; border-bottom:1px solid var(--rule); padding:12px 20px;
           display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:1.15rem; margin:0; display:flex; align-items:center; gap:8px; }
  header a { color:var(--blue); text-decoration:none; font-weight:500; }
  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f1f5f9;
    border: 1px solid var(--rule);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.85rem;
  }
  .role-pill {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
  }
  .role-ADMIN { background: #e3f2fd; color: #0d47a1; }
  .role-OWNER { background: #f3e5f5; color: #4a148c; }
  .role-MANAGER { background: #e8f5e9; color: #1b5e20; }
  .role-AGENT { background: #fff3e0; color: #e65100; }
  
  #chat { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin-bottom:16px; }
  .you { text-align:right; }
  .you span { background:var(--blue); color:#fff; padding:9px 14px; border-radius:14px 14px 2px 14px;
              display:inline-block; max-width:80%; text-align:left; }
  .ai span { background:#fff; border:1px solid var(--rule); padding:11px 15px;
             border-radius:14px 14px 14px 2px; display:inline-block; max-width:85%; white-space:pre-wrap; }
  .tools { font-size:0.75rem; color:var(--soft); margin-top:5px; font-family:monospace; }
  .chips { padding:0 20px 8px; max-width:820px; width:100%; margin:0 auto;
           display:flex; gap:8px; flex-wrap:wrap; }
  .chips button { background:#fff; border:1px solid var(--rule); color:var(--soft);
                  padding:6px 11px; border-radius:99px; font-size:0.83rem; cursor:pointer; }
  .chips button:hover { border-color:var(--blue); color:var(--blue); }
  form { display:flex; gap:8px; padding:14px 20px; background:#fff; border-top:1px solid var(--rule); }
  form > div { display:flex; gap:8px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:11px 14px; border:1px solid var(--rule); border-radius:99px; font-size:0.95rem; }
  button.send { padding:11px 20px; border:0; border-radius:99px; background:var(--blue);
                color:#fff; font-size:0.95rem; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:0.5; }
</style>
</head>
<body>
<header>
  <h1>💬 DropPoint Assistant</h1>
  <div id="userInfo" class="user-badge" style="display:none;">
    <span id="userName">User</span>
    <span id="userRole" class="role-pill">ROLE</span>
  </div>
  <a href="/index.html" id="backLink">← Back to Dashboard</a>
</header>

<div id="chat">
  <div class="msg ai"><span>Ask me about your deliveries, orders, or today's operational status.</span></div>
</div>

<div class="chips" id="chipsContainer">
  <!-- Dynamic suggestions populated by JS based on role -->
</div>

<form onsubmit="event.preventDefault(); ask(document.getElementById('q').value);">
  <div>
    <input id="q" placeholder="Type a question…" autocomplete="off">
    <button class="send" id="send">Ask</button>
  </div>
</form>

<script>
let currentUser = null;
const saved = localStorage.getItem('dp_user');
if (saved) {
  try {
    currentUser = JSON.parse(saved);
  } catch(e){}
}

if (currentUser) {
  document.getElementById('userInfo').style.display = 'flex';
  document.getElementById('userName').textContent = currentUser.name;
  const rEl = document.getElementById('userRole');
  rEl.textContent = currentUser.role;
  rEl.className = 'role-pill role-' + currentUser.role;
  if (currentUser.role === 'AGENT') {
    document.getElementById('backLink').href = '/mobile.html';
  }
}

const chipsContainer = document.getElementById('chipsContainer');
const role = currentUser ? currentUser.role : 'MANAGER';

if (role === 'AGENT') {
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">What are my assigned deliveries today?</button>
    <button onclick="ask(this.textContent)">How many stops do I have remaining?</button>
    <button onclick="ask(this.textContent)">Customer address for my next stop</button>
    <button onclick="ask(this.textContent)">My delivery target progress today</button>
  `;
} else if (role === 'MANAGER') {
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">What is happening today?</button>
    <button onclick="ask(this.textContent)">Which areas have unassigned orders waiting?</button>
    <button onclick="ask(this.textContent)">Which agent has lowest capacity load?</button>
    <button onclick="ask(this.textContent)">How many total orders waiting in intake?</button>
  `;
} else if (role === 'OWNER') {
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">Which customers have we lost?</button>
    <button onclick="ask(this.textContent)">Who was late most this month?</button>
    <button onclick="ask(this.textContent)">Why are deliveries running late?</button>
    <button onclick="ask(this.textContent)">Overall completion rate today</button>
  `;
} else { // ADMIN
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">List all active user accounts</button>
    <button onclick="ask(this.textContent)">Total orders and active agents count</button>
    <button onclick="ask(this.textContent)">Unassigned areas summary</button>
    <button onclick="ask(this.textContent)">What is happening today?</button>
  `;
}

const chat = document.getElementById('chat');

function add(cls, text, tools) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<span></span>';
  d.firstChild.textContent = text;
  if (tools && tools.length) {
    const t = document.createElement('div');
    t.className = 'tools';
    t.textContent = 'used: ' + [...new Set(tools)].join(', ');
    d.appendChild(t);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask(question) {
  if (!question.trim()) return;
  document.getElementById('q').value = '';
  document.getElementById('send').disabled = true;
  add('you', question);
  const thinking = add('ai', 'Thinking…');

  try {
    const res = await fetch('/api/assistant/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        question,
        role: currentUser ? currentUser.role : 'MANAGER',
        agentId: currentUser ? currentUser.id : null
      })
    });
    const out = await res.json();
    thinking.remove();
    if (res.ok) {
      add('ai', out.answer, out.toolsUsed);
    } else {
      add('ai', out.error || 'Something went wrong.');
    }
  } catch (e) {
    thinking.remove();
    add('ai', 'Cannot reach the server.');
  }
  document.getElementById('send').disabled = false;
}
</script>
</body>
</html>
