<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropPoint — Ask</title>
<style>
  :root { --ink:#1c2733; --soft:#4d5b69; --rule:#d5dce3; --blue:#1f6e8c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f5f7f9; color:var(--ink);
         display:flex; flex-direction:column; height:100vh; }
  header { background:#fff; border-bottom:1px solid var(--rule); padding:14px 20px;
           display:flex; align-items:center; gap:16px; }
  h1 { font-size:1.15rem; margin:0; }
  header a { color:var(--blue); }
  header a:first-of-type { margin-left:auto; }
  #chat { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin-bottom:16px; }
  .you { text-align:right; }
  .you span { background:var(--blue); color:#fff; padding:9px 14px; border-radius:14px 14px 2px 14px;
              display:inline-block; max-width:80%; text-align:left; }
  .ai span { background:#fff; border:1px solid var(--rule); padding:11px 15px;
             border-radius:14px 14px 14px 2px; display:inline-block; max-width:85%; white-space:pre-wrap; }
  .tools { font-size:0.75rem; color:var(--soft); margin-top:5px; font-family:monospace; }
  .chips { padding:0 20px 8px; max-width:820px; width:100%; margin:0 auto;
           display:flex; gap:8px; flex-wrap:wrap; }
  .chips button { background:#fff; border:1px solid var(--rule); color:var(--soft);
                  padding:6px 11px; border-radius:99px; font-size:0.83rem; cursor:pointer; }
  .chips button:hover { border-color:var(--blue); color:var(--blue); }
  form { display:flex; gap:8px; padding:14px 20px; background:#fff; border-top:1px solid var(--rule); }
  form > div { display:flex; gap:8px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:11px 14px; border:1px solid var(--rule); border-radius:9px; font-size:1rem; }
  button.send { padding:11px 20px; border:0; border-radius:9px; background:var(--blue);
                color:#fff; font-size:1rem; cursor:pointer; }
  button.send:disabled { opacity:0.5; }
</style>
</head>
<body>
<header>
  <h1>Ask DropPoint</h1>
  <a href="/board.html">Order board</a>
  <a href="/map.html">Live map</a>
</header>

<div id="chat">
  <div class="msg ai"><span>Ask me about your agents, deliveries or customers.</span></div>
</div>

<div class="chips">
  <button onclick="ask(this.textContent)">Who was late most this month?</button>
  <button onclick="ask(this.textContent)">Why are deliveries running late?</button>
  <button onclick="ask(this.textContent)">Which customers have we lost?</button>
  <button onclick="ask(this.textContent)">What is happening today?</button>
</div>

<form onsubmit="event.preventDefault(); ask(document.getElementById('q').value);">
  <div>
    <input id="q" placeholder="Type a question…" autocomplete="off">
    <button class="send" id="send">Ask</button>
  </div>
</form>

<script>
const chat = document.getElementById('chat');

function add(cls, text, tools) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<span></span>';
  d.firstChild.textContent = text;
  if (tools && tools.length) {
    const t = document.createElement('div');
    t.className = 'tools';
    t.textContent = 'used: ' + [...new Set(tools)].join(', ');
    d.appendChild(t);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask(question) {
  if (!question.trim()) return;
  document.getElementById('q').value = '';
  document.getElementById('send').disabled = true;
  add('you', question);
  const thinking = add('ai', 'Thinking…');

  try {
    const res = await fetch('/api/assistant/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const out = await res.json();
    thinking.remove();
    if (res.ok) {
      add('ai', out.answer, out.toolsUsed);
    } else {
      add('ai', out.error || 'Something went wrong.');
    }
  } catch (e) {
    thinking.remove();
    add('ai', 'Cannot reach the server.');
  }
  document.getElementById('send').disabled = false;
}
</script>
</body>
</html>
