<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant · DropPoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .head-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .back {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
    border: 1px solid var(--line-strong); color: var(--ink-2); text-decoration: none; background: var(--surface);
  }
  .back:hover { background: var(--surface-2); }
  .back svg, .ai-mark svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ai-mark {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; color: #fff;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6); box-shadow: 0 6px 16px rgba(99,102,241,0.3);
  }
  h1 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: -0.01em; }
  .sub { font-size: 0.76rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sub::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
  .user-badge { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; font-weight: 500; color: var(--ink-2); }

  #chat { flex: 1; overflow-y: auto; padding: 28px 20px 12px; width: 100%; max-width: 820px; margin: 0 auto; }
  .msg { display: flex; gap: 10px; margin-bottom: 18px; align-items: flex-start; animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg > span {
    padding: 11px 15px; border-radius: 16px; max-width: min(85%, 640px);
    white-space: pre-wrap; line-height: 1.6; font-size: 0.92rem;
  }
  .ai { flex-wrap: wrap; }
  .ai::before {
    content: ""; width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6) center / 100% no-repeat;
    -webkit-mask: none;
  }
  .ai > span { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; box-shadow: var(--shadow-sm); color: var(--ink); }
  .you { justify-content: flex-end; }
  .you > span { background: var(--ink); color: #fff; border-top-right-radius: 4px; }
  .tools {
    flex-basis: 100%; margin-left: 40px; margin-top: -2px;
    font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; gap: 6px;
  }
  .tools::before {
    content: "DATA"; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
    color: var(--brand-600); background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: 5px; padding: 1px 5px;
  }

  .chips { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 20px 12px; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .chips button {
    font: inherit; font-size: 0.82rem; font-weight: 500; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 7px 13px; cursor: pointer; transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .chips button:hover { border-color: var(--brand); color: var(--brand-600); box-shadow: var(--shadow-sm); }

  form { flex-shrink: 0; padding: 12px 20px 18px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  form > .composer {
    display: flex; gap: 8px; align-items: center; width: 100%; max-width: 820px; margin: 0 auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px; padding: 6px 6px 6px 16px;
    box-shadow: var(--shadow); transition: border-color 0.15s, box-shadow 0.15s;
  }
  form > .composer:focus-within { border-color: var(--brand); box-shadow: var(--ring), var(--shadow); }
  #q { flex: 1; border: 0; outline: none; font: inherit; font-size: 0.95rem; background: transparent; color: var(--ink); padding: 8px 0; }
  button.send {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: 0; border-radius: 11px;
    background: var(--brand); color: #fff; font: inherit; font-weight: 600; font-size: 0.88rem; cursor: pointer;
  }
  button.send:hover { background: var(--brand-600); }
  button.send:disabled { opacity: 0.5; cursor: default; }
  button.send svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .fineprint { max-width: 820px; margin: 8px auto 0; text-align: center; font-size: 0.72rem; color: var(--faint); }

  @media (max-width: 600px) {
    header { padding: 10px 14px; }
    .user-badge #userName { display: none; }
    #chat { padding: 20px 14px 8px; }
    .chips { padding: 0 14px 10px; flex-wrap: nowrap; overflow-x: auto; }
    .chips button { white-space: nowrap; }
    form { padding: 10px 14px 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="head-left">
    <a href="/index.html" id="backLink" class="back" aria-label="Back" title="Back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="ai-mark"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span>
    <div>
      <h1>DropPoint Assistant</h1>
      <div class="sub">Answers from your live data</div>
    </div>
  </div>
  <div id="userInfo" class="user-badge" style="display:none;">
    <span id="userName">User</span>
    <span id="userRole" class="role-pill">ROLE</span>
  </div>
</header>

<div id="chat">
  <div class="msg ai"><span>Hi! Ask me about deliveries, agents, customers or what is happening today. I look up the answer in your data before I reply.</span></div>
</div>

<div class="chips" id="chipsContainer">
</div>

<form onsubmit="event.preventDefault(); ask(document.getElementById('q').value);">
  <div class="composer">
    <input id="q" placeholder="Ask a question…" autocomplete="off">
    <button class="send" id="send">
      Ask
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="fineprint">The assistant can only read data. It never changes anything.</div>
</form>

<script>
let currentUser = null;
const saved = localStorage.getItem('dp_user');
if (saved) {
  try {
    currentUser = JSON.parse(saved);
  } catch(e){}
}

if (currentUser) {
  document.getElementById('userInfo').style.display = 'flex';
  document.getElementById('userName').textContent = currentUser.name;
  const rEl = document.getElementById('userRole');
  rEl.textContent = currentUser.role;
  rEl.className = 'role-pill role-' + currentUser.role;
  if (currentUser.role === 'AGENT') {
    document.getElementById('backLink').href = '/mobile.html';
  }
}

const chipsContainer = document.getElementById('chipsContainer');
const role = currentUser ? currentUser.role : 'MANAGER';

if (role === 'AGENT') {
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">What are my assigned deliveries today?</button>
    <button onclick="ask(this.textContent)">How many stops do I have remaining?</button>
    <button onclick="ask(this.textContent)">Customer address for my next stop</button>
    <button onclick="ask(this.textContent)">My delivery target progress today</button>
  `;
} else if (role === 'MANAGER') {
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">What is happening today?</button>
    <button onclick="ask(this.textContent)">How many orders are still waiting to be assigned?</button>
    <button onclick="ask(this.textContent)">Which agent has the most failed deliveries this week?</button>
    <button onclick="ask(this.textContent)">Which agents checked in late this week?</button>
  `;
} else if (role === 'OWNER') {
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">Which customers have we lost?</button>
    <button onclick="ask(this.textContent)">Who was late most this month?</button>
    <button onclick="ask(this.textContent)">Why are deliveries failing?</button>
    <button onclick="ask(this.textContent)">Overall completion rate today</button>
  `;
} else {
  chipsContainer.innerHTML = `
    <button onclick="ask(this.textContent)">How many deliveries did we do this week?</button>
    <button onclick="ask(this.textContent)">How many agents are on duty right now?</button>
    <button onclick="ask(this.textContent)">Which areas have the most failed deliveries?</button>
    <button onclick="ask(this.textContent)">What is happening today?</button>
  `;
}

const chat = document.getElementById('chat');

function add(cls, text, tools) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<span></span>';
  d.firstChild.textContent = text;
  if (tools && tools.length) {
    const t = document.createElement('div');
    t.className = 'tools';
    t.textContent = 'used: ' + [...new Set(tools)].join(', ');
    d.appendChild(t);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask(question) {
  if (!question.trim()) return;
  document.getElementById('q').value = '';
  document.getElementById('send').disabled = true;
  add('you', question);
  const thinking = add('ai', 'Thinking…');

  try {
    const res = await fetch('/api/assistant/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        role: currentUser ? currentUser.role : 'MANAGER',
        agentId: currentUser ? currentUser.id : null
      })
    });
    const out = await res.json();
    thinking.remove();
    if (res.ok) {
      add('ai', out.answer, out.toolsUsed);
    } else {
      add('ai', out.error || 'Something went wrong.');
    }
  } catch (e) {
    thinking.remove();
    add('ai', 'Cannot reach the server.');
  }
  document.getElementById('send').disabled = false;
}
</script>
</body>
</html>
