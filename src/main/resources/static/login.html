<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropPoint — Sign In</title>
<style>
  :root {
    --primary: #0f62fe;
    --primary-hover: #0353e9;
    --dark: #0f172a;
    --slate: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #334155;
  }
  .login-container {
    width: 100%;
    max-width: 440px;
  }
  .brand-header {
    text-align: center;
    margin-bottom: 28px;
    color: #ffffff;
  }
  .brand-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    background: var(--primary);
    border-radius: 14px;
    margin-bottom: 12px;
    box-shadow: 0 10px 25px rgba(15, 98, 254, 0.4);
  }
  .brand-logo svg {
    width: 26px;
    height: 26px;
    fill: #ffffff;
  }
  .brand-header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand-header p {
    color: #94a3b8;
    font-size: 0.9rem;
    margin-top: 4px;
  }
  .login-card {
    background: var(--card);
    border-radius: 18px;
    padding: 32px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #475569;
    margin-bottom: 8px;
  }
  .form-control {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    color: #0f172a;
    background: #fff;
    transition: border-color 0.15s ease;
  }
  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.15);
  }
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: 0;
    border-radius: 10px;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
    margin-top: 6px;
  }
  .btn-submit:hover {
    background: var(--primary-hover);
  }
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 24px 0 18px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border);
  }
  .divider span {
    padding: 0 10px;
  }
  .demo-roles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .demo-role-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .demo-role-btn:hover {
    border-color: var(--primary);
    background: #eff6ff;
    transform: translateY(-1px);
  }
  .demo-role-btn .role-tag {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .tag-admin { background: #e3f2fd; color: #0d47a1; }
  .tag-owner { background: #f3e5f5; color: #4a148c; }
  .tag-manager { background: #e8f5e9; color: #1b5e20; }
  .tag-agent { background: #fff3e0; color: #e65100; }

  .demo-role-btn .role-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: #1e293b;
  }
  .demo-role-btn .role-sub {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--red);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="brand-header">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <h1>DropPoint</h1>
    <p>Logistics & Delivery Management Portal</p>
  </div>

  <div class="login-card">
    <div id="errorBox" class="error-box"></div>

    <form onsubmit="handleFormLogin(event)">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" class="form-control" placeholder="Enter phone number" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="pin">PIN / Password</label>
        <input type="password" id="pin" class="form-control" placeholder="Default PIN: 1234" value="1234" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign In to Dashboard</button>
    </form>

    <div class="divider">
      <span>Or Select Account</span>
    </div>

    <div class="demo-roles">
      <div class="demo-role-btn" onclick="quickLogin('0000000000', '1234')">
        <span class="role-tag tag-admin">ADMIN</span>
        <div class="role-title">System Admin</div>
        <div class="role-sub">Full System Access</div>
      </div>
      <div class="demo-role-btn" onclick="quickLogin('1111111111', '1234')">
        <span class="role-tag tag-owner">OWNER</span>
        <div class="role-title">Agency Owner</div>
        <div class="role-sub">Reports & Performance</div>
      </div>
      <div class="demo-role-btn" onclick="quickLogin('2222222222', '1234')">
        <span class="role-tag tag-manager">MANAGER</span>
        <div class="role-title">Manager</div>
        <div class="role-sub">Intake, Agents, Plan</div>
      </div>
      <div class="demo-role-btn" onclick="quickLogin('3333333333', '1234')">
        <span class="role-tag tag-agent">AGENT</span>
        <div class="role-title">Delivery Agent</div>
        <div class="role-sub">My Route Today</div>
      </div>
    </div>
  </div>
</div>

<script>
async function quickLogin(phone, pin) {
  document.getElementById('phone').value = phone;
  document.getElementById('pin').value = pin;
  await performLogin(phone, pin);
}

async function handleFormLogin(e) {
  e.preventDefault();
  const phone = document.getElementById('phone').value.trim();
  const pin = document.getElementById('pin').value.trim();
  await performLogin(phone, pin);
}

function getRedirectUrl(role) {
  const isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (role === 'AGENT' && isMobile) return '/mobile.html';
  if (role === 'AGENT') return '/mobile.html'; // agents always go to mobile portal
  return '/index.html';
}

async function performLogin(phone, pin) {
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');
  errorBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ phone, pin })
    });
    
    if (res.ok) {
      const user = await res.json();
      localStorage.setItem('dp_user', JSON.stringify(user));
      window.location.href = getRedirectUrl(user.role);
    } else {
      const err = await res.json();
      errorBox.textContent = err.error || 'Invalid phone or PIN.';
      errorBox.style.display = 'block';
    }
  } catch (e) {
    errorBox.textContent = 'Unable to connect to server.';
    errorBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In to Dashboard';
  }
}

// Redirect if already logged in
const saved = localStorage.getItem('dp_user');
if (saved) {
  try {
    const u = JSON.parse(saved);
    if (u && u.role) window.location.href = getRedirectUrl(u.role);
  } catch(e){}
}
</script>

</body>
</html>
