<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropPoint — Owner Dashboard</title>
<style>
  :root {
    --ink:#1c2733; --soft:#4d5b69; --rule:#d5dce3; --paper:#f5f7f9;
    --blue:#1f6e8c; --green:#1e6b47; --amber:#9a6a00; --red:#b3261e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--paper); color:var(--ink); }
  header { background:#fff; border-bottom:1px solid var(--rule); padding:14px 22px;
           display:flex; align-items:center; gap:22px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  h1 { font-size:1.2rem; margin:0; }
  nav { margin-left:auto; display:flex; gap:16px; }
  nav a { color:var(--blue); text-decoration:none; font-size:0.93rem; }
  nav a:hover { text-decoration:underline; }
  main { padding:22px; max-width:1280px; margin:0 auto; }
  h2 { font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em;
       color:var(--soft); margin:26px 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:14px 16px; }
  .card b { display:block; font-size:1.9rem; line-height:1.1; }
  .card small { color:var(--soft); font-size:0.83rem; }
  .card.good b { color:var(--green); }
  .card.warn b { color:var(--amber); }
  .card.bad b { color:var(--red); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  @media (max-width:980px) { .grid { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; background:#fff;
          border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--rule); font-size:0.9rem; }
  th { background:#edf1f5; font-weight:600; font-size:0.82rem; }
  tr:last-child td { border-bottom:none; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .on { background:var(--green); } .off { background:var(--rule); }
  .risk-high { color:var(--red); font-weight:600; }
  .risk-mid { color:var(--amber); font-weight:600; }
  .bars { display:flex; align-items:flex-end; gap:5px; height:110px;
          background:#fff; border:1px solid var(--rule); border-radius:10px; padding:12px; }
  .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end;
         align-items:center; height:100%; gap:3px; }
  .bar i { width:100%; background:var(--rule); border-radius:3px 3px 0 0; display:block; }
  .bar i.late { background:var(--red); }
  .bar span { font-size:0.68rem; color:var(--soft); }
  #ask { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:14px 16px; }
  #ask input { width:100%; padding:10px 12px; border:1px solid var(--rule);
               border-radius:8px; font-size:0.95rem; }
  #ask .chips { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 0; }
  #ask .chips button { background:var(--paper); border:1px solid var(--rule); color:var(--soft);
                       padding:5px 10px; border-radius:99px; font-size:0.8rem; cursor:pointer; }
  #ask .chips button:hover { border-color:var(--blue); color:var(--blue); }
  #answer { margin-top:12px; white-space:pre-wrap; font-size:0.92rem; line-height:1.55; }
  #tools { font-family:monospace; font-size:0.74rem; color:var(--soft); margin-top:7px; }
  footer { color:var(--soft); font-size:0.82rem; padding:26px 0 8px; }
</style>
</head>
<body>

<header>
  <h1>DropPoint — L.B. Nagar</h1>
  <span id="clock" style="color:var(--soft); font-size:0.88rem"></span>
  <nav>
    <a href="/board.html">Order board</a>
    <a href="/map.html">Live map</a>
    <a href="/assistant.html">Assistant</a>
  </nav>
</header>

<main>
  <h2>Today</h2>
  <div class="cards" id="today"></div>

  <h2>Last 30 days</h2>
  <div class="cards" id="month"></div>

  <div class="grid" style="margin-top:22px">
    <div>
      <h2 style="margin-top:0">Agents</h2>
      <table>
        <thead><tr><th>Agent</th><th class="num">Deliveries</th><th class="num">Late</th>
                   <th class="num">Avg vs ETA</th><th class="num">Late check-ins</th></tr></thead>
        <tbody id="agents"><tr><td colspan="5">Loading…</td></tr></tbody>
      </table>

      <h2>Late deliveries by hour</h2>
      <div class="bars" id="hours"></div>
    </div>

    <div>
      <h2 style="margin-top:0">Ask the assistant</h2>
      <div id="ask">
        <input id="q" placeholder="Ask about agents, deliveries or customers…"
               onkeydown="if(event.key==='Enter') ask(this.value)">
        <div class="chips">
          <button onclick="ask(this.textContent)">Who was late most this month?</button>
          <button onclick="ask(this.textContent)">Why are deliveries running late?</button>
          <button onclick="ask(this.textContent)">Which customers have we lost and why?</button>
        </div>
        <div id="answer"></div>
        <div id="tools"></div>
      </div>

      <h2>Customers at risk</h2>
      <table>
        <thead><tr><th>Customer</th><th class="num">Quiet</th><th class="num">Usual gap</th>
                   <th class="num">Late</th><th class="num">Failed</th></tr></thead>
        <tbody id="risk"><tr><td colspan="5">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <footer id="foot"></footer>
</main>

<script>
const n = v => v == null ? '—' : v;

function card(value, label, cls) {
  return `<div class="card ${cls || ''}"><b>${n(value)}</b><small>${label}</small></div>`;
}

async function load() {
  try {
    const d = await fetch('/api/dashboard').then(r => r.json());

    document.getElementById('today').innerHTML =
        card(d.today.agents_on_duty, 'agents on duty', d.today.agents_on_duty > 0 ? 'good' : '')
      + card(d.today.orders_waiting, 'waiting to assign', d.today.orders_waiting > 0 ? 'warn' : '')
      + card(d.today.orders_in_progress, 'out for delivery')
      + card(d.today.delivered_today, 'delivered today', 'good')
      + card(d.today.failed_today, 'failed today', d.today.failed_today > 0 ? 'bad' : '')
      + card(d.today.flagged_today, 'flagged today', d.today.flagged_today > 0 ? 'bad' : '');

    const m = d.month;
    document.getElementById('month').innerHTML =
        card(m.deliveries, 'deliveries')
      + card(m.on_time_pct + '%', 'on time', m.on_time_pct >= 85 ? 'good' : 'warn')
      + card(m.late, 'late', m.late > 0 ? 'warn' : '')
      + card(m.avg_minutes_vs_eta + ' min', 'average vs ETA',
             m.avg_minutes_vs_eta > 0 ? 'warn' : 'good')
      + card(m.flagged, 'flagged deliveries', m.flagged > 0 ? 'bad' : '');

    document.getElementById('agents').innerHTML = d.agents.map(a => `
      <tr>
        <td><span class="dot ${a.on_duty ? 'on' : 'off'}"></span>${a.agent}</td>
        <td class="num">${n(a.deliveries)}</td>
        <td class="num">${n(a.late)}</td>
        <td class="num">${n(a.avg_vs_eta)}</td>
        <td class="num ${a.late_checkins > 10 ? 'risk-high' : ''}">${n(a.late_checkins)}</td>
      </tr>`).join('');

    const max = Math.max(1, ...d.lateByHour.map(h => h.deliveries));
    document.getElementById('hours').innerHTML = d.lateByHour.map(h => `
      <div class="bar" title="${h.late} late of ${h.deliveries} deliveries">
        <i class="late" style="height:${h.late / max * 100}%"></i>
        <i style="height:${(h.deliveries - h.late) / max * 100}%"></i>
        <span>${h.hour}h</span>
      </div>`).join('');

    document.getElementById('risk').innerHTML = d.atRisk.slice(0, 8).map(c => {
      const ratio = c.usual_gap_days ? c.days_quiet / c.usual_gap_days : 1;
      const cls = ratio >= 2 ? 'risk-high' : ratio >= 1.4 ? 'risk-mid' : '';
      return `<tr>
        <td>${c.name}${c.active === false ? ' <small style="color:var(--soft)">(inactive)</small>' : ''}</td>
        <td class="num ${cls}">${c.days_quiet}d</td>
        <td class="num">${n(c.usual_gap_days)}d</td>
        <td class="num">${n(c.late_deliveries)}</td>
        <td class="num">${n(c.failed_deliveries)}</td>
      </tr>`;
    }).join('');

    document.getElementById('foot').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('foot').textContent = 'Cannot reach the server.';
  }
}

async function ask(question) {
  if (!question || !question.trim()) return;
  document.getElementById('q').value = question;
  document.getElementById('answer').textContent = 'Thinking…';
  document.getElementById('tools').textContent = '';
  try {
    const res = await fetch('/api/assistant/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const out = await res.json();
    document.getElementById('answer').textContent = res.ok ? out.answer : (out.error || 'Failed.');
    if (res.ok) {
      document.getElementById('tools').textContent =
        'queried: ' + [...new Set(out.toolsUsed)].join(', ') + ' · ' + out.millis + ' ms';
    }
  } catch (e) {
    document.getElementById('answer').textContent = 'Cannot reach the server.';
  }
}

function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' });
}

load(); tick();
setInterval(load, 15000);
setInterval(tick, 1000);
</script>
</body>
</html>
