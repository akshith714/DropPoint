<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>DropPoint Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
    <style>
        /* names the page scripts use */
        :root { --primary: var(--brand); --border: var(--line); --text-dark: var(--ink-2); --dark: var(--ink); }

        * { -webkit-tap-highlight-color: transparent; }
        body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); font-size: 15px; }

        /* ---------- header ---------- */
        header {
            background: radial-gradient(600px 240px at 0% 0%, #1e3a8a 0%, transparent 70%), var(--night);
            color: #fff;
            padding: calc(14px + env(safe-area-inset-top)) 16px 22px;
            border-radius: 0 0 22px 22px;
            flex-shrink: 0;
        }
        .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
        .brand .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, #3b82f6, #6366f1); }
        .brand svg { width: 16px; height: 16px; fill: #fff; }
        .head-actions { display: flex; gap: 8px; }
        .head-btn {
            height: 36px; min-width: 36px; padding: 0 12px; border-radius: 10px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: #e2e8f0; font: inherit; font-size: 0.8rem; font-weight: 600; text-decoration: none; cursor: pointer;
        }
        .head-btn.icon { padding: 0; }
        .head-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .greeting { margin-top: 18px; display: flex; align-items: center; gap: 12px; }
        .greeting .avatar { width: 44px; height: 44px; font-size: 0.95rem; box-shadow: 0 0 0 3px rgba(255,255,255,0.12); }
        .greeting small { display: block; color: #94a3b8; font-size: 0.8rem; }
        .agent-name { display: block; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }

        /* ---------- layout ---------- */
        main { flex: 1; padding-bottom: calc(92px + env(safe-area-inset-bottom)); margin-top: -8px; }
        .tab-content { display: none; padding: 16px; animation: fadeIn 0.2s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        /* Deliveries and SOS appear only once the agent is checked in */
        body:not(.on-duty) .duty-only { display: none !important; }

        .card {
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
            padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
        }
        h2 { font-size: 1.02rem; font-weight: 650; margin: 0 0 12px; color: var(--ink); letter-spacing: -0.01em; }
        .muted { color: var(--muted); font-size: 0.84rem; }

        /* ---------- buttons ---------- */
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 15px; margin-top: 16px;
            font: inherit; font-size: 0.98rem; font-weight: 600; color: #fff;
            border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 1px 2px rgba(15,23,42,0.1), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: transform 0.08s, filter 0.15s;
        }
        .btn:active { transform: scale(0.985); filter: brightness(0.95); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-green { background: var(--success); }
        .btn-amber { background: #d97706; }
        .btn-red { background: var(--danger); }
        .btn-primary { background: var(--brand); }
        .btn-sm { padding: 11px 14px; font-size: 0.9rem; margin-top: 0; border-radius: 10px; }
        .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; }
        .error-msg:empty { display: none; }

        /* ---------- duty ---------- */
        .duty-card h2 { display: flex; align-items: center; justify-content: space-between; }
        .gps-line { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
        .gps-line svg { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        #gpsStatusText { font-weight: 600; }
        .status-badge { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
        .status-active { background: var(--success-50); color: var(--success); }
        .status-inactive { background: #eef1f5; color: var(--ink-2); }
        .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 1.6s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(21,128,61,0.45); }
            70% { box-shadow: 0 0 0 7px rgba(21,128,61,0); }
            100% { box-shadow: 0 0 0 0 rgba(21,128,61,0); }
        }
        #checkInActions > div { font-size: 0.9rem; }

        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .quick-tile {
            display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left;
            padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface);
            font: inherit; color: var(--ink); cursor: pointer; box-shadow: var(--shadow-sm);
        }
        .quick-tile:active { transform: scale(0.98); }
        .quick-tile .qi { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; }
        .quick-tile .qi svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .quick-tile b { font-size: 0.92rem; }
        .quick-tile span.muted { font-size: 0.76rem; }

        /* ---------- deliveries ---------- */
        .progress-container { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .progress-text { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 0.86rem; color: var(--muted); font-weight: 500; }
        #deliveryProgressText { font-size: 1.1rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
        .progress-bar { height: 8px; background: #e9edf3; border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, var(--success)); border-radius: 99px; transition: width 0.4s ease; }
        .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .list-head h2 { margin: 0; }
        .refresh-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .refresh-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .delivery-card { position: relative; padding-left: 20px; overflow: hidden; }
        .delivery-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--line-strong); }
        .delivery-card.status-ASSIGNED::before { background: #f59e0b; }
        .delivery-card.status-DELIVERED::before { background: var(--success); }
        .delivery-card.status-FAILED::before { background: var(--danger); }
        .delivery-card.status-DELIVERED, .delivery-card.status-FAILED { background: var(--surface-2); box-shadow: none; }
        .delivery-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
        .customer-name { font-weight: 650; font-size: 1.02rem; letter-spacing: -0.01em; }
        .cylinder-count { flex-shrink: 0; background: var(--brand-50); color: var(--brand-600); padding: 3px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; }
        .delivery-details { font-size: 0.87rem; color: var(--ink-2); line-height: 1.45; }
        .area-chip { display: inline-block; margin-top: 6px; font-size: 0.72rem; font-weight: 600; color: var(--muted); background: #eef1f5; padding: 2px 8px; border-radius: 6px; }
        .status-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .detail-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
        .phone-link {
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
            color: var(--brand-600); background: var(--brand-50); border: 1px solid var(--brand-100);
            padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; touch-action: manipulation;
        }
        .phone-link:active { background: var(--brand-100); }
        .delivery-actions { display: flex; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
        .delivery-actions .btn { flex: 1; }
        .empty-state { text-align: center; padding: 36px 20px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); }
        .empty-state svg { width: 36px; height: 36px; stroke: var(--faint); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 8px; }
        .empty-state b { display: block; color: var(--ink); margin-bottom: 4px; }

        /* ---------- SOS ---------- */
        .sos-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 260px); text-align: center; padding: 20px 0; }
        .sos-ring { padding: 18px; border-radius: 50%; background: radial-gradient(circle, rgba(220,38,38,0.08) 0%, rgba(220,38,38,0.03) 70%); margin-bottom: 26px; }
        .sos-btn {
            width: 190px; height: 190px; border-radius: 50%; border: none; cursor: pointer;
            background: radial-gradient(circle at 35% 30%, #f87171, var(--danger) 55%, #b91c1c);
            color: #fff; font: inherit; font-size: 2.1rem; font-weight: 800; letter-spacing: 0.06em;
            box-shadow: 0 14px 34px rgba(220,38,38,0.4), inset 0 -6px 14px rgba(0,0,0,0.15), 0 0 0 8px rgba(220,38,38,0.12);
            display: flex; align-items: center; justify-content: center; transition: transform 0.12s;
            -webkit-user-select: none; user-select: none;
        }
        .sos-btn:active { transform: scale(0.95); }
        .sos-btn.active-sos { font-size: 1.3rem; animation: pulse-red 1.1s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.7), 0 14px 34px rgba(220,38,38,0.4); }
            70% { box-shadow: 0 0 0 26px rgba(220,38,38,0), 0 14px 34px rgba(220,38,38,0.4); }
            100% { box-shadow: 0 0 0 0 rgba(220,38,38,0), 0 14px 34px rgba(220,38,38,0.4); }
        }
        .sos-instructions { color: var(--ink-2); font-size: 0.95rem; padding: 0 28px; line-height: 1.5; }
        .sos-instructions b { display: block; font-size: 1.1rem; color: var(--ink); margin-bottom: 4px; }
        .sos-status-msg { margin-top: 12px; font-weight: 700; color: var(--danger); line-height: 1.5; }

        /* ---------- bottom nav ---------- */
        nav {
            position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex; height: 64px; padding: 6px; z-index: 1000;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(14px);
            border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(15,23,42,0.14);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            border-radius: 13px; color: var(--faint); cursor: pointer; transition: background 0.15s, color 0.15s;
        }
        .nav-item svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-item span { font-size: 0.7rem; font-weight: 600; }
        .nav-item.active { color: var(--brand); background: var(--brand-50); }
        #nav-sos.active { color: var(--danger); background: var(--danger-50); }

        /* ---------- loading ---------- */
        .loading-overlay {
            position: fixed; inset: 0; z-index: 2000; display: none;
            align-items: center; justify-content: center; flex-direction: column; gap: 12px;
            background: rgba(244,246,250,0.75); backdrop-filter: blur(3px);
            color: var(--ink-2); font-weight: 600; font-size: 0.9rem;
        }
        .loading-overlay::before {
            content: ""; width: 34px; height: 34px; border-radius: 50%;
            border: 3px solid var(--brand-100); border-top-color: var(--brand); animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="head-row">
            <div class="brand">
                <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></span>
                DropPoint
            </div>
            <div class="head-actions">
                <a href="/assistant.html" class="head-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
                    Ask AI
                </a>
                <button class="head-btn icon" onclick="logout()" aria-label="Log out" title="Log out">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                </button>
            </div>
        </div>
        <div class="greeting">
            <span class="avatar" id="agentAvatar">?</span>
            <div style="min-width:0">
                <small id="greetingText">Welcome</small>
                <span class="agent-name" id="agentNameDisplay">Agent</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Check-In Tab -->
        <div id="tab-checkin" class="tab-content active">
            <div class="card duty-card">
                <h2>Duty status
                    <span id="dutyStatusContainer">
                        <span class="status-badge status-inactive" id="dutyBadge">
                            <span id="dutyBadgeText">Not Checked In</span>
                        </span>
                    </span>
                </h2>

                <div class="gps-line" id="gpsStatusContainer">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
                    <span>GPS</span>
                    <strong id="gpsStatusText">Acquiring GPS...</strong>
                </div>

                <div id="checkInActions">
                    <!-- Dynamic content -->
                </div>

                <div id="checkInError" class="error-msg"></div>
            </div>

            <!-- Quick Access (on duty only) -->
            <div class="quick-grid duty-only">
                <button class="quick-tile" onclick="switchTab('deliveries')">
                    <span class="qi" style="background:var(--brand-50); color:var(--brand);"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span>
                    <b>Today's deliveries</b>
                    <span class="muted">Your stops and codes</span>
                </button>
                <button class="quick-tile" onclick="switchTab('sos')">
                    <span class="qi" style="background:var(--danger-50); color:var(--danger);"><svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></span>
                    <b>Emergency SOS</b>
                    <span class="muted">Alert your manager</span>
                </button>
            </div>
        </div>

        <!-- Deliveries Tab -->
        <div id="tab-deliveries" class="tab-content">
            <div class="progress-container">
                <div class="progress-text">
                    <span>Delivered today</span>
                    <span id="deliveryProgressText">0 of 0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="deliveryProgressBar"></div>
                </div>
            </div>

            <div class="list-head">
                <h2>Stops</h2>
                <button class="refresh-btn" onclick="loadDeliveries()">
                    <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
                    Refresh
                </button>
            </div>

            <div id="deliveriesList">
                <!-- Delivery cards will be inserted here -->
            </div>
        </div>

        <!-- SOS Tab -->
        <div id="tab-sos" class="tab-content">
            <div class="sos-container">
                <div class="sos-ring">
                    <button id="sosBtn" class="sos-btn">SOS</button>
                </div>
                <div class="sos-instructions" id="sosInstructions">
                    <b>Emergency alert</b>
                    Press and hold for 2 seconds. Your manager sees your location immediately.
                </div>
                <div class="sos-status-msg" id="sosStatusMsg"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav>
        <div class="nav-item active" onclick="switchTab('checkin')" id="nav-checkin">
            <svg viewBox="0 0 24 24"><path d="M12 22s7-7.5 7-13a7 7 0 1 0-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
            <span>Duty</span>
        </div>
        <div class="nav-item duty-only" onclick="switchTab('deliveries')" id="nav-deliveries">
            <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
            <span>Deliveries</span>
        </div>
        <div class="nav-item duty-only" onclick="switchTab('sos')" id="nav-sos">
            <svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
            <span>SOS</span>
        </div>
    </nav>

    <div class="loading-overlay" id="loadingOverlay">Processing...</div>

    <script>
        // --- Authentication Check ---
        let currentUser = null;
        function checkAuth() {
            const saved = localStorage.getItem('dp_user');
            if (!saved) {
                window.location.href = '/login.html';
                return;
            }
            try {
                currentUser = JSON.parse(saved);
                if (currentUser.role !== 'AGENT') {
                    window.location.href = '/login.html';
                    return;
                }
                const name = currentUser.name || 'Agent';
                document.getElementById('agentNameDisplay').textContent = name;
                document.getElementById('agentAvatar').textContent =
                    name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
                const hour = new Date().getHours();
                document.getElementById('greetingText').textContent =
                    hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
            } catch (e) {
                window.location.href = '/login.html';
            }
        }
        
        function logout() {
            localStorage.removeItem('dp_user');
            window.location.href = '/login.html';
        }

        checkAuth();

        // --- State Management ---
        let currentGps = null;
        let isCheckedIn = false;
        let activeSos = false;
        let trackingWatchId = null;
        let pingInterval = null;

        // --- Tab Switching ---
        function switchTab(tabId) {
            if (tabId !== 'checkin' && !document.body.classList.contains('on-duty')) {
                tabId = 'checkin';
            }
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.top-tab-btn').forEach(el => el.classList.remove('active'));
            
            const targetTab = document.getElementById(`tab-${tabId}`);
            const bottomNav = document.getElementById(`nav-${tabId}`);
            const topNav = document.getElementById(`top-nav-${tabId}`);

            if (targetTab) targetTab.classList.add('active');
            if (bottomNav) bottomNav.classList.add('active');
            if (topNav) topNav.classList.add('active');

            if (tabId === 'deliveries') {
                loadDeliveries();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Utilities ---
        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        // --- Geolocation ---
        function getGpsLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("Geolocation is not supported by your browser"));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentGps = {
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude,
                            accuracyMetres: Math.round(pos.coords.accuracy),
                            mockLocation: false // Hard to detect reliably in pure JS, setting default
                        };
                        resolve(currentGps);
                    },
                    err => {
                        reject(err);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        // --- Check-In Tab Logic ---
        async function initCheckInTab() {
            try {
                document.getElementById('gpsStatusText').textContent = "Acquiring GPS...";
                await getGpsLocation();
                document.getElementById('gpsStatusText').textContent = `GPS Ready (${currentGps.accuracyMetres}m accuracy)`;
                document.getElementById('gpsStatusText').style.color = "var(--green)";
            } catch (err) {
                document.getElementById('gpsStatusText').textContent = "GPS Failed. Check permissions.";
                document.getElementById('gpsStatusText').style.color = "var(--red)";
            }
            
            checkDutyStatus();
        }

        async function checkDutyStatus() {
            if (!currentUser) return;
            try {
                showLoading(true);
                const res = await fetch(`/api/agents/${currentUser.id}/status`);
                if (res.ok) {
                    const data = await res.json();
                    isCheckedIn = data.checkedIn;
                    activeSos = data.activeSos || false;
                    renderDutyStatus(data);
                    if (activeSos) {
                        updateSosUI(true);
                    }
                }
            } catch (err) {
                console.error("Error fetching status", err);
            } finally {
                showLoading(false);
            }
        }

        function renderDutyStatus(statusData) {
            const container = document.getElementById('checkInActions');
            const badge = document.getElementById('dutyBadge');
            const badgeText = document.getElementById('dutyBadgeText');
            
            container.innerHTML = '';
            document.getElementById('checkInError').textContent = '';

            const onDuty = !!statusData.checkedIn;
            document.body.classList.toggle('on-duty', onDuty);
            if (!onDuty) {
                switchTab('checkin');
            }

            if (statusData.checkedOutAt) {
                // Already checked out for the day (or session)
                badge.className = 'status-badge status-inactive';
                badgeText.textContent = "Checked Out";
                
                const msg = document.createElement('div');
                msg.textContent = `Checked out. Worked ${Math.floor(statusData.workedMinutes / 60) || 0} hours ${statusData.workedMinutes % 60 || 0} minutes.`;
                msg.style.fontWeight = '500';
                container.appendChild(msg);
                stopTracking();
            }
            else if (statusData.checkedIn) {
                // Checked In
                badge.className = 'status-badge status-active';
                badge.innerHTML = `<div class="pulse-dot"></div><span id="dutyBadgeText">Checked In</span>`;
                
                const timeStr = statusData.checkInAt ? new Date(statusData.checkInAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
                
                const msg = document.createElement('div');
                msg.textContent = `Live tracking active (Since ${timeStr})`;
                msg.style.color = 'var(--muted)';
                container.appendChild(msg);

                const btn = document.createElement('button');
                btn.className = 'btn btn-amber';
                btn.textContent = 'Check out';
                btn.onclick = handleCheckOut;
                container.appendChild(btn);
                
                startTracking();
            } else {
                // Not Checked In
                badge.className = 'status-badge status-inactive';
                badgeText.textContent = "Not Checked In";

                const btn = document.createElement('button');
                btn.className = 'btn btn-green';
                btn.textContent = currentGps ? `Check In` : 'Acquiring GPS...';
                btn.disabled = !currentGps;
                btn.onclick = handleCheckIn;
                container.appendChild(btn);
            }
        }

        async function handleCheckIn() {
            if (!currentGps) return;
            
            document.getElementById('checkInError').textContent = '';
            showLoading(true);
            try {
                const res = await fetch(`/api/agents/${currentUser.id}/check-in`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentGps)
                });
                const data = await res.json();
                
                if (res.ok && data.allowed) {
                    checkDutyStatus(); // reload status
                } else {
                    let err = data.message || "Check-in failed.";
                    if (data.status === 'TOO_FAR') err = `Too far from branch. ${data.message}`;
                    if (data.status === 'MOCK_LOCATION') err = `Mock location detected!`;
                    document.getElementById('checkInError').textContent = err;
                }
            } catch (err) {
                document.getElementById('checkInError').textContent = "Network error during check-in.";
            } finally {
                showLoading(false);
            }
        }

        async function handleCheckOut() {
            document.getElementById('checkInError').textContent = '';
            showLoading(true);
            try {
                const res = await fetch(`/api/agents/${currentUser.id}/check-out`, {
                    method: 'POST'
                });
                if (res.ok) {
                    checkDutyStatus();
                } else {
                    document.getElementById('checkInError').textContent = "Check-out failed.";
                }
            } catch (err) {
                document.getElementById('checkInError').textContent = "Network error during check-out.";
            } finally {
                showLoading(false);
            }
        }

        function startTracking() {
            if (pingInterval) return; // already tracking

            // Send ping every 30 seconds
            pingInterval = setInterval(sendPing, 30000);
            
            if (navigator.geolocation) {
                trackingWatchId = navigator.geolocation.watchPosition(pos => {
                    currentGps = {
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracyMetres: Math.round(pos.coords.accuracy),
                        mockLocation: false
                    };
                }, err => {
                    console.warn("Watch position error", err);
                }, { enableHighAccuracy: true });
            }
        }

        function stopTracking() {
            if (pingInterval) {
                clearInterval(pingInterval);
                pingInterval = null;
            }
            if (trackingWatchId !== null && navigator.geolocation) {
                navigator.geolocation.clearWatch(trackingWatchId);
                trackingWatchId = null;
            }
        }

        async function sendPing() {
            if (!currentGps || !isCheckedIn) return;
            try {
                await fetch(`/api/agents/${currentUser.id}/ping`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: currentGps.latitude,
                        longitude: currentGps.longitude,
                        accuracyMetres: currentGps.accuracyMetres,
                        simulated: false
                    })
                });
            } catch(e) {
                console.warn("Ping failed", e);
            }
        }

        // --- Deliveries Tab Logic ---
        async function loadDeliveries() {
            const list = document.getElementById('deliveriesList');
            list.innerHTML = '<div class="empty-state"><span class="spinner" style="color:var(--brand)"></span></div>';
            
            try {
                const res = await fetch(`/api/agents/${currentUser.id}/orders`);
                if (res.ok) {
                    let orders = await res.json();
                    
                    // Sort: ASSIGNED first, then DELIVERED, then FAILED
                    const orderPriority = { 'ASSIGNED': 1, 'DELIVERED': 2, 'FAILED': 3 };
                    orders.sort((a, b) => orderPriority[a.status] - orderPriority[b.status]);
                    
                    renderDeliveries(orders);
                } else {
                    list.innerHTML = '<div class="error-msg" style="text-align:center;">Failed to load deliveries.</div>';
                }
            } catch (err) {
                list.innerHTML = '<div class="error-msg" style="text-align:center;">Network error.</div>';
            }
        }

        /** Escapes text from the server before it goes into innerHTML. */
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g,
                c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderDeliveries(orders) {
            const list = document.getElementById('deliveriesList');
            list.innerHTML = '';
            
            let delivered = 0;
            let total = orders.length;

            if (total === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                        <b>No deliveries yet</b>
                        Your stops appear here once the manager confirms today's plan.
                    </div>`;
            }

            orders.forEach(order => {
                if (order.status === 'DELIVERED') delivered++;
                
                const card = document.createElement('div');
                card.className = `card delivery-card status-${order.status}`;
                
                let actionsHtml = '';
                if (order.status === 'ASSIGNED') {
                    actionsHtml = `
                    <div class="delivery-actions">
                        <button class="btn btn-sm btn-green" onclick="markDelivered(${order.id})">Delivered</button>
                        <button class="btn btn-sm btn-red" style="background:var(--surface); color:var(--danger); border:1px solid #f5c2c2; box-shadow:none;" onclick="markFailed(${order.id})">Failed</button>
                    </div>`;
                }

                const statusLabel = { ASSIGNED: 'To deliver', DELIVERED: 'Delivered', FAILED: 'Not delivered' }[order.status] || order.status;
                const statusColor = order.status === 'ASSIGNED' ? '#b45309' : (order.status === 'DELIVERED' ? 'var(--green)' : 'var(--red)');
                const cyl = order.cylinderCount === 1 ? '1 cylinder' : `${order.cylinderCount} cylinders`;

                card.innerHTML = `
                    <div class="delivery-header">
                        <span class="customer-name">${esc(order.customerName)}</span>
                        <span class="cylinder-count">${cyl}</span>
                    </div>
                    <div class="delivery-details">
                        <div>${esc(order.address)}</div>
                        ${order.areaName ? `<span class="area-chip">${esc(order.areaName)}</span>` : ''}
                    </div>
                    <div class="detail-row">
                        <a href="tel:${esc(order.customerPhone)}" class="phone-link">
                            <svg style="width:15px; height:15px; fill:currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                            Call ${esc(order.customerPhone)}
                        </a>
                        <span class="status-chip" style="color:${statusColor}">${statusLabel}</span>
                    </div>
                    ${actionsHtml}
                `;
                list.appendChild(card);
            });

            // Update Progress
            document.getElementById('deliveryProgressText').textContent = `${delivered} of ${total}`;
            const pct = total === 0 ? 0 : (delivered / total) * 100;
            document.getElementById('deliveryProgressBar').style.width = `${pct}%`;
        }

        async function markDelivered(orderId) {
            const code = prompt("Enter 4-digit delivery code from customer:");
            if (!code) return;
            
            showLoading(true);
            try {
                await getGpsLocation(); // Fresh GPS
                const res = await fetch(`/api/orders/${orderId}/deliver`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agentId: currentUser.id,
                        latitude: currentGps ? currentGps.latitude : 0,
                        longitude: currentGps ? currentGps.longitude : 0,
                        code: code
                    })
                });
                const data = await res.json();
                if (res.ok && data.accepted) {
                    alert("Delivery successful!");
                    loadDeliveries();
                } else {
                    alert("Delivery failed: " + (data.message || data.error || "Invalid code"));
                }
            } catch (err) {
                alert("Network error.");
            } finally {
                showLoading(false);
            }
        }

        async function markFailed(orderId) {
            const reason = await pickFailureReason();
            if (!reason) return;

            showLoading(true);
            try {
                const res = await fetch(`/api/orders/${orderId}/fail`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agentId: currentUser.id,
                        reason: reason
                    })
                });
                const data = await res.json();
                if (res.ok && data.accepted) {
                    alert("Order marked as failed.");
                    loadDeliveries();
                } else {
                    alert("Failed to update status: " + (data.message || data.error));
                }
            } catch (err) {
                alert("Network error.");
            } finally {
                showLoading(false);
            }
        }

        // The only values the server accepts; a free-text reason is rejected.
        const FAILURE_REASONS = [
            ['NOBODY_HOME', 'Nobody home'],
            ['WRONG_ADDRESS', 'Wrong address'],
            ['CUSTOMER_REFUSED', 'Customer refused'],
            ['NO_ACCESS', 'No access to building'],
            ['OTHER', 'Other']
        ];

        /** Shows a reason picker; resolves to the chosen code, or null if cancelled. */
        function pickFailureReason() {
            return new Promise(resolve => {
                const dlg = document.createElement('dialog');
                dlg.style.cssText = 'border:none; border-radius:12px; padding:20px; width:min(320px, 90vw);';
                dlg.innerHTML = `
                    <form method="dialog">
                        <div style="font-weight:bold; margin-bottom:12px;">Why could it not be delivered?</div>
                        <select name="reason" style="width:100%; padding:10px; font-size:16px; margin-bottom:16px;">
                            ${FAILURE_REASONS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}
                        </select>
                        <div style="display:flex; gap:8px; justify-content:flex-end;">
                            <button value="" style="padding:10px 16px;">Cancel</button>
                            <button value="ok" style="padding:10px 16px; background:#c62828; color:#fff; border:none; border-radius:6px;">Mark failed</button>
                        </div>
                    </form>`;
                document.body.appendChild(dlg);
                dlg.addEventListener('close', () => {
                    const chosen = dlg.returnValue === 'ok' ? dlg.querySelector('select').value : null;
                    dlg.remove();
                    resolve(chosen);
                });
                dlg.showModal();
            });
        }

        // --- SOS Tab Logic ---
        const sosBtn = document.getElementById('sosBtn');
        let sosPressTimer;
        
        sosBtn.addEventListener('touchstart', startSosPress);
        sosBtn.addEventListener('touchend', cancelSosPress);
        sosBtn.addEventListener('mousedown', startSosPress);
        sosBtn.addEventListener('mouseup', cancelSosPress);
        sosBtn.addEventListener('mouseleave', cancelSosPress);

        function startSosPress(e) {
            if (activeSos) return;
            
            sosBtn.style.transform = 'scale(0.9)';
            sosPressTimer = setTimeout(() => {
                triggerSos();
            }, 2000);
        }

        function cancelSosPress(e) {
            if (activeSos) return;
            sosBtn.style.transform = 'scale(1)';
            clearTimeout(sosPressTimer);
        }

        async function triggerSos() {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            
            try {
                await getGpsLocation();
            } catch(e) {} // continue even if GPS fails
            
            try {
                const res = await fetch(`/api/agents/${currentUser.id}/sos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: currentGps ? currentGps.latitude : 0,
                        longitude: currentGps ? currentGps.longitude : 0
                    })
                });
                if (res.ok) {
                    updateSosUI(true);
                }
            } catch (err) {
                alert("Failed to send SOS. Check network.");
            }
        }

        function updateSosUI(isActive) {
            activeSos = isActive;
            const btn = document.getElementById('sosBtn');
            const msg = document.getElementById('sosStatusMsg');
            const inst = document.getElementById('sosInstructions');
            
            if (isActive) {
                btn.classList.add('active-sos');
                btn.textContent = "SOS ACTIVE";
                inst.style.display = 'none';
                msg.innerHTML = "SOS Alert Sent!<br>Your manager has been notified.";
            } else {
                btn.classList.remove('active-sos');
                btn.textContent = "SOS";
                inst.style.display = 'block';
                msg.innerHTML = "";
            }
        }

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            initCheckInTab();
            loadDeliveries();
        });

    </script>
</body>
</html>
