spring.application.name=droppoint
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5434/droppoint
spring.datasource.username=${DB_USER:droppoint}
spring.datasource.password=${DB_PASSWORD:droppoint}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
