spring.application.name=droppoint
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5434/droppoint
spring.datasource.username=${DB_USER:droppoint}
spring.datasource.password=${DB_PASSWORD:droppoint}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Responses are UTF-8: without this a client that guesses Latin-1 shows mojibake.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# AI assistant (Groq). The key lives in local.properties, which is not committed.
droppoint.groq.api-key=${GROQ_API_KEY:}
droppoint.groq.model=openai/gpt-oss-120b
spring.config.import=optional:file:./local.properties
